name: Documentation improvement
description: Suggest a clarification or improvement to ROVER Web instructions.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: "e.g., README - Try the MQTT playground"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Explain what would make this easier for a ROVER Web user.
